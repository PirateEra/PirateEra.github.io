journey:
  - "I'm a Machine Learning Engineer and Game Developer with a passion for building intelligent systems and engaging, data-driven game worlds. My journey began in 2016 when I enrolled in a Game Development course at Grafisch Lyceum Utrecht. There, I created my first major project, <strong>High Tide</strong>, with a good friend, which increased my passion for building games from the ground up."
  - "From there, I continued as a game developer creating <strong>Pirate Era</strong>, a Minecraft MMORPG server that grew to over 30,000 members. This long-term project was my real-world classroom, teaching me everything from server architecture and custom plugin development to managing SQL databases and using Python tools to analyze player behavior and balance gameplay."
  - "To formalize my self-taught skills, I pursued a propaedeutic in Software Engineering, which I passed with Cum Laude distinction. This solidified my engineering foundation and led me to the University of Amsterdam. There, I completed my BSc in Artificial Intelligence, served as a Teaching Assistant for core computer science courses, and volunteered with the Dutch Nao Team."
  - "I recently <strong>graduated from my MSc in Artificial Intelligence</strong> at the University of Amsterdam and am now open to job opportunities. In parallel, I work as an independent game developer and build AI solutions for companies, mostly for contractors. I am interested in bringing this mix of research-grade ML and practical engineering into a full-time role."

